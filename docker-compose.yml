version: "3.9"

services:
  app1:
    image: danttera/rinha-2026:sha-55b012b
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "9999"
    deploy:
      resources:
        limits:
          memory: 150mb
          cpus: "0.4"


  app2:
    image: danttera/rinha-2026:sha-55b012b
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "9999"
    deploy:
      resources:
        limits:
          memory: 150mb
          cpus: "0.4"


  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          memory: 50mb
          cpus: "0.2"
